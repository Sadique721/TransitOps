server:
  port: 8080

spring:
  application:
    name: transitops-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:pg-3383bbf0-entitykart.l.aivencloud.com}:${DB_PORT:13332}/${DB_NAME:defaultdb}?sslmode=${DB_SSL_MODE:require}
    username: ${DB_USER:avnadmin}
    password: ${DB_PASSWORD:avn_password_placeholder}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:entitykart@gmail.com}
    password: ${MAIL_PASSWORD:mail_password_placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

jwt:
  secret: ${JWT_SECRET:transitops-super-secret-key-change-this-in-production-min-256-bits}
  access-token-expiry-ms: 900000        # 15 minutes
  refresh-token-expiry-ms: 604800000    # 7 days

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

security:
  rate-limit:
    max-attempts: 5
    window-minutes: 15

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:transitops;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
